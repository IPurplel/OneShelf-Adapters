# Live source check (maintainers, manual): runs OneShelf's live source suite at the pinned Core commit
# against the Official adapters from this checkout. Evidence only: it never changes a trust level, uses no
# credentials, and packaged tests remain the gate.
name: Live source check

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "pytest -k expression, e.g. gutenberg (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check out OneShelf at the pinned commit
        run: |
          REF="$(tr -d '[:space:]' < tooling/oneshelf-core-ref.txt)"
          git init -q "$RUNNER_TEMP/oneshelf"
          git -C "$RUNNER_TEMP/oneshelf" fetch -q --depth=1 https://github.com/IPurplel/OneShelf.git "$REF"
          git -C "$RUNNER_TEMP/oneshelf" checkout -q FETCH_HEAD
      - name: Use this checkout's Official adapters
        run: |
          rm -r "$RUNNER_TEMP/oneshelf/backend/plugins/official"/oneshelf.*
          cp -R adapters/official/oneshelf.* "$RUNNER_TEMP/oneshelf/backend/plugins/official/"
      - name: Run the live suite
        working-directory: ${{ runner.temp }}/oneshelf/backend
        env:
          ONESHELF_LIVE_SOURCES: "1"
          FILTER: ${{ inputs.filter }}
        run: |
          python -m pip install --quiet ".[dev]"
          if [ -n "$FILTER" ]; then
            python -m pytest -m live tests/live -k "$FILTER" -rA
          else
            python -m pytest -m live tests/live -rA
          fi
