capability: search
inputs: [query]
request:
  url: "{base_url}/search?q={query}"
response:
  format: html
extract:
  items: {css: "li.result"}
  fields:
    listing_key:
      css: "a::attr(href)"
      transforms: [{regex_extract: {pattern: '/books/([^/?#]+)', group: 1}}]
      required: true
    title: {css: "a::text", transforms: [trim], required: true}
    creator: {css: ".author::text", transforms: [trim]}
pagination:
  mode: none
  complete_when: single_response
