base_url: https://www.authorama.com
url_patterns:
  - pattern: '^https?://(?:www\.)?authorama\.com/([a-z0-9]+(?:-[a-z0-9]+)*)-[0-9]+\.html(?:[?#]|$)'
    capability: work
    id_group: 1
  - pattern: '^https?://(?:www\.)?authorama\.com/book/([a-z0-9]+(?:-[a-z0-9]+)*)\.html(?:[?#]|$)'
    capability: work
    id_group: 1
# robots.txt has one rule, "Disallow: text" (no leading slash), which matches none of the paths requested.
rate_limit:
  requests_per_minute: 20
  concurrency: 1
