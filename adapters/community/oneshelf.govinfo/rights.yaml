# What this source lets a OneShelf user do, and how the adapter keeps to it (docs/rights-model.md).
schema: oneshelf.rights/1
access_scope: per_item
access_type: public_domain
rights_granularity: item
license:
  id: null
  url: null
commercial_use: allowed
redistribution: allowed
derivatives: allowed
attribution:
  required: false
  text: "GovInfo, U.S. Government Publishing Office — https://www.govinfo.gov/"
visibility: eligible_items_only
local_copy: eligible_items_only
enforcement:
  summary: >-
    GovInfo's Public Domain & Copyright Notice: works of the U.S. Government are not subject to copyright
    (17 U.S.C. § 105) and "can generally be reprinted without legal restriction", but Government publications
    may contain copyrighted material used with permission. The adapter offers only collections authored by
    the U.S. Government — the Economic Report of the President, the Budget, GAO reports, the Government
    Manual, committee reports, United States Reports, public laws and the Statutes at Large. Hearings,
    committee prints and general publications, which may reprint third-party material, have no unit and no
    file (tests 3, 4). The PDF is stored unaltered for private reading.
  exclusion_tests: [3, 4]
evidence:
  - claim: "Public Domain & Copyright Notice (17 U.S.C. § 105; publications may contain copyrighted material used with permission)."
    url: https://www.govinfo.gov/about/policies
  - claim: A package's MODS record naming its PDF rendition.
    url: https://www.govinfo.gov/metadata/pkg/ERP-2024/mods.xml
  - claim: robots.txt disallows /search/ and /app/search/ only (besides site administration).
    url: https://www.govinfo.gov/robots.txt
last_verified: 2026-10-07
