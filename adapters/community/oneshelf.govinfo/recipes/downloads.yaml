# The package's PDF, as its MODS record names it — only in the collections the catalog offers.
capability: downloads
inputs: [unit_key]
request:
  url: "{base_url}/metadata/pkg/{unit_key:path}/mods.xml"
  headers: {Accept: application/xml}
response:
  format: html
extract:
  items: {xpath: "(//mods/location/url[@displaylabel = 'PDF rendition'])[1]"}
  fields:
    url:
      xpath: "./text()"
      required: true
      transforms: [trim, {regex_extract: {pattern: '^(https://www\.govinfo\.gov/content/pkg/(?:ERP|BUDGET|GAOREPORTS|GOVMAN|CRPT|USREPORTS|PLAW|STATUTE)-[A-Za-z0-9-]+/pdf/[A-Za-z0-9-]+\.pdf)$', group: 1}}]
    format: {template: "pdf", required: true}
pagination:
  mode: none
  complete_when: single_response
