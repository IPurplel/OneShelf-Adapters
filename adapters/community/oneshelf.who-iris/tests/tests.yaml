  fixtures: [{url: 'https://iris.who.int/items/eb2b6676-8177-4897-ad01-0018b86db28f', file: fixtures/item-eb2b6676.html}]
  expect:
    min_items: 1
    complete: true
    first: {unit_key: items/eb2b6676-8177-4897-ad01-0018b86db28f}
- capability: downloads
  inputs: {unit_key: items/eb2b6676-8177-4897-ad01-0018b86db28f}
  fixtures: [{url: 'https://iris.who.int/items/eb2b6676-8177-4897-ad01-0018b86db28f', file: fixtures/item-eb2b6676.html}]
