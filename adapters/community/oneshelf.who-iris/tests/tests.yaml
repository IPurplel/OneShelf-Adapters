# Fixtures are live item pages (2026-10-07), trimmed to their <head> (without styles and scripts) and the
# licence badge: what the recipes read.
cases:
- capability: work
  inputs: {listing_key: items/eb2b6676-8177-4897-ad01-0018b86db28f}
  fixtures: [{url: 'https://iris.who.int/items/eb2b6676-8177-4897-ad01-0018b86db28f', file: fixtures/item-eb2b6676.html}]
  expect:
    first: {title: "Действия в отношении гипертонии и избыточного потребления соли: снижение бремени сердечно-сосудистых заболеваний в Европейском регионе ВОЗ"}
- capability: catalog
