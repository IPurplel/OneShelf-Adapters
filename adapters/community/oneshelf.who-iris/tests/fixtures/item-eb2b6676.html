<noscript></noscript><noscript></noscript><link rel="icon" href="assets/client/images/favicons/favicon.ico" sizes="any" class="theme-head-tag"><meta name="Generator" content="DSpace 7.6"><meta name="title" content="Действия в отношении гипертонии и избыточного потребления соли: снижение бремени сердечно-сосудистых заболеваний в Европейском регионе ВОЗ"><meta name="description" content="Повышенное артериальное давление – основной фактор риска смертности и инвалидизации в Европейском регионе ВОЗ. Оно является причиной почти четверти всех случаев смерти и одним из основных факторов, способствующих развитию сердечно-сосудистых заболеваний (ССЗ). Потребление соли – значительный фактор риска развития гипертонии и ССЗ. Снижение потребления соли приводит к снижению артериального давления. Показатели распространенности гипертонии, потребления соли и преждевременной смертности от ССЗ выше в восточных частях Региона и среди мужчин. Настоящий доклад, подготовленный для Специальной инициативы Европейского регионального бюро ВОЗ по сокращению неравенства в бремени сердечно-сосудистых заболеваний и распространенности высокого артериального давления путем улучшения контроля гипертонии в первичном звене здравоохранения и внедрения стратегий сокращения потребления соли, содержит справочную информацию и может помочь странам в достижении глобальных целевых показателей в отношении неинфекционных заболеваний. В документе изложены концепция и обоснование комплексного подхода, обзор основных проблем и анализ ситуации, а также представлен прогресс в достижении глобальных целевых показателей для Европейского региона ВОЗ. В нем предлагаются научно обоснованные вмешательства в рамках стратегий сокращения потребления соли и борьбы с гипертонией, обсуждаются препятствия на пути их внедрения и возможные решения, а в заключение рассматриваются вопросы политики. Документ основан на реальных примерах и имеющихся фактических данных, в нем отражен реальный жизненный опыт, и он содержит ссылки на соответствующие ресурсы ВОЗ."><meta name="citation_title" content="Действия в отношении гипертонии и избыточного потребления соли: снижение бремени сердечно-сосудистых заболеваний в Европейском регионе ВОЗ"><meta name="citation_author" content="Всемирная организация здравоохранения. Европейское региональное бюро"><meta name="citation_publication_date" content="2024-06-26"><meta name="citation_isbn" content="9789289061209 (PDF)"><meta name="citation_language" content="Русский"><meta name="citation_keywords" content="Sodium Chloride, Dietary; Hypertension; Blood Pressure; Cardiovascular Diseases; Antihypertensive Agents; Risk Factors; Publications"><meta name="citation_abstract_html_url" content="https://iris.who.int/handle/10665/378000"><meta name="citation_publisher" content="Всемирная организация здравоохранения. Европейское региональное бюро"><meta name="citation_online_date" content="2024-06-26T14:05:47Z"><meta name="citation_date" content="2024-06-26"><link href="https://iris.who.int/bitstreams/a2e4fd44-1318-4637-8dd2-36c91de3504e/download" rel="item" type="application/pdf"><link href="https://iris.who.int/signposting/describedby/eb2b6676-8177-4897-ad01-0018b86db28f" rel="describedby" type="application/vnd.datacite.datacite+xml"><link href="https://iris.who.int/handle/10665/378000" rel="cite-as"><link href="https://creativecommons.org/licenses/by-nc-sa/3.0/igo" rel="license"><link href="https://iris.who.int/signposting/linksets/eb2b6676-8177-4897-ad01-0018b86db28f" rel="linkset" type="application/linkset"><link href="https://iris.who.int/signposting/linksets/eb2b6676-8177-4897-ad01-0018b86db28f/json" rel="linkset" type="application/linkset+json"><link href="https://schema.org/AboutPage" rel="type"><link href="https://schema.org/CreativeWork" rel="type"><meta name="citation_pdf_url" content="https://iris.who.int/bitstreams/a2e4fd44-1318-4637-8dd2-36c91de3504e/download"></head><body><a _ngcontent-sc160="" class="dont-break-out" target="_blank" href="/bitstreams/a2e4fd4
