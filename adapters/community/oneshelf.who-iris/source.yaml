base_url: https://iris.who.int
url_patterns:
  - pattern: '^https://iris\.who\.int/((?:items|entities/publication)/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|handle/10665/[0-9]+)/?(?:[?#]|$)'
    capability: work
    id_group: 1
# robots.txt (DSpace 7) disallows /search, /browse, the REST API except bitstreams, and "/full" item views;
# item pages and /bitstreams/<id>/download are allowed. Crawl-delay 10: 6 requests a minute, one at a time.
# Files are read from /server/api/core/bitstreams/<id>/content, which robots.txt allows explicitly.
rate_limit:
  requests_per_minute: 6
  concurrency: 1
