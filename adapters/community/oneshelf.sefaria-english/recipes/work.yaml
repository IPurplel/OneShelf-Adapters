capability: work
inputs: [listing_key]
request:
  url: "{base_url}/api/v2/index/{listing_key:path}"
  headers: {Accept: application/json}
response:
  format: json
extract:
  fields:
    title: {json: "$.title", required: true, transforms: [trim]}
    original_title: {json: "$.heTitle", transforms: [trim]}
    aliases: {json: "$.titleVariants[*]", all: true}
    description: {json: "$.enShortDesc", transforms: [trim]}
    language: {template: "en"}
    content_type: {template: "book"}
