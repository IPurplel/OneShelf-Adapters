base_url: https://lark.uowasit.edu.iq
url_patterns:
  - pattern: '^https://lark\.uowasit\.edu\.iq/index\.php/lark/(?:[a-z]{2}(?:_[A-Z]{2})?/)?issue/view/([0-9]+)(?:[/?#]|$)'
    capability: work
    id_group: 1
# robots.txt disallows only /cache/; nothing this adapter requests.
rate_limit:
  requests_per_minute: 20
  concurrency: 1
