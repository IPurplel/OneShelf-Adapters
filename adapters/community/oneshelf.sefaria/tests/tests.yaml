# Fixtures are live API responses (2026-10-07). Exclusions: the Babylonian Talmud has page addressing (case 4),
# and Bereshit Rabbah's source version has licence "unknown" (case 5).
cases:
- capability: search
  inputs:
    query: genesis
  fixtures:
  - url: https://www.sefaria.org/api/name/genesis?limit=30
    file: fixtures/genesis-name.json
  expect:
    min_items: 5
    complete: true
    first:
      listing_key: Genesis
      title: Genesis
- capability: work
  inputs:
    listing_key: Genesis
  fixtures:
  - url: https://www.sefaria.org/api/v2/index/Genesis
    file: fixtures/genesis-index.json
  expect:
    first:
      title: Genesis
      original_title: בראשית
- capability: catalog
  inputs:
    listing_key: Genesis
  fixtures:
  - url: https://www.sefaria.org/api/v2/index/Genesis?with_content_counts=1
    file: fixtures/genesis-counts.json
  expect:
    min_items: 50
    complete: true
    first:
      unit_key: Genesis.1
      number: '1'
      unit_type: chapter
- capability: reader
  inputs:
    unit_key: Genesis.1
  fixtures:
  - url: https://www.sefaria.org/api/v3/texts/Genesis.1?version=source
    file: fixtures/genesis1-source.json
  expect:
    min_items: 31
    complete: true
    first:
      title: בראשית א׳
    text_contains: בְּרֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים
    min_text_chars: 40
- capability: catalog
  inputs:
    listing_key: Berakhot
  fixtures:
  - url: https://www.sefaria.org/api/v2/index/Berakhot?with_content_counts=1
    file: fixtures/berakhot-counts.json
  expect:
    first:
      unit_key: null
- capability: reader
  inputs:
    unit_key: Bereshit Rabbah.1
  fixtures:
  - url: https://www.sefaria.org/api/v3/texts/Bereshit%20Rabbah.1?version=source
    file: fixtures/bereshit-rabbah1-source.json
  expect:
    first:
      html: null
