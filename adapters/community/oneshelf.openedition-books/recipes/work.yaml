capability: work
inputs: [listing_key]
request:
  url: "{base_url}/{listing_key:path}"
  headers: {Accept: text/html}
response:
  format: html
extract:
  fields:
    title: {css: "meta[name=citation_title]::attr(content)", required: true, transforms: [trim]}
    creator: {xpath: "//meta[@name='citation_author']/@content", all: true, transforms: [{join: {sep: ", "}}]}
    description: {css: "meta[name='DC.description']::attr(content)", transforms: [trim]}
    language: {css: "meta[name=citation_language]::attr(content)", transforms: [trim]}
    cover_url: {css: "meta[property='og:image']::attr(content)", transforms: [normalize_url]}
    content_type: {template: "book"}
