# What this source lets a OneShelf user do, and how the adapter keeps to it (docs/rights-model.md).
schema: oneshelf.rights/1
access_scope: per_item
access_type: mixed
rights_granularity: item
license:
  id: null
  url: null
commercial_use: unknown
redistribution: allowed_with_conditions
derivatives: unknown
attribution:
  required: true
  text: "The article's authors, مجلة كلية الآداب, Thamar University — https://journal.tu.edu.ye/index.php/artsmain"
visibility: all_listed_items
local_copy: eligible_items_only
enforcement:
  summary: >-
    Each article page of the journal (Open Journal Systems) states its own licence in machine-readable form: a
    DC.Rights meta tag linking Creative Commons (https://creativecommons.org/licenses/by/4.0 on article 3222, 2026-10-12). Not every article
    carries one, so an issue's articles are listed with their titles and an article's PDF is offered only while
    its own page states a Creative Commons licence (test 3: the same page with its licence removed, marked
    SYNTHETIC, gives no file). Commercial use and derivatives
    depend on each article's licence and are marked unknown; the PDF is stored unaltered for private reading.
  exclusion_tests: [3]
evidence:
  - claim: An article page with DC.Rights https://creativecommons.org/licenses/by/4.0 and citation_pdf_url.
    url: https://journal.tu.edu.ye/index.php/artsmain/article/view/3222
  - claim: robots.txt disallows only /cache/.
    url: https://journal.tu.edu.ye/robots.txt
last_verified: 2026-10-12
