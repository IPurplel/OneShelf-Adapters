cases:
# Arabic query. The fixture carries one non-PDF entry (a .jpg, second) that the request itself would not
# return: it must be skipped, not listed.
- capability: search
  inputs: {query: الجبر}
  fixtures:
  - url: https://api.wikimedia.org/core/v1/commons/search/page?q=filetype%3Apdf%20%D8%A7%D9%84%D8%AC%D8%A8%D8%B1&limit=100
    file: fixtures/search-ar.json
  expect:
    min_items: 4
    complete: true
    fields_present: [listing_key, title, cover_url]
    first: {listing_key: File:المختصر_في_حساب_الجبر_والمقابلة.pdf, title: المختصر في حساب الجبر والمقابلة}
- capability: search
  inputs: {query: zzqxnomatch}
  fixtures:
  - url: https://api.wikimedia.org/core/v1/commons/search/page?q=filetype%3Apdf%20zzqxnomatch&limit=100
    file: fixtures/search-empty.json
  expect:
    min_items: 0
    complete: true
- capability: work
  inputs: {listing_key: File:المختصر_في_حساب_الجبر_والمقابلة.pdf}
