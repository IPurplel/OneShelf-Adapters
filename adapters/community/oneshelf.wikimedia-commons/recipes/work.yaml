capability: work
inputs: [listing_key]
request:
  url: "{base_url}/core/v1/commons/file/{listing_key:path}"
  headers: {Accept: application/json}
response:
  format: json
extract:
  fields:
    title: {json: "$.title", required: true,
            transforms: [{regex_extract: {pattern: '^(.+?)(?:\.(?i:pdf))?$', group: 1}}, trim]}
    # The first page, rendered by Commons.
    cover_url: {json: "$.preferred.url"}
