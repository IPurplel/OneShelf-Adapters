# NTRS's public search, limited to records with a document (disseminated=DOCUMENT_AND_METADATA). Whether a
# record may be offered is decided by its catalog. page.from is a zero-based result offset; stats.total
# lets the runtime report completion only after every result has been read (within the page cap).
capability: search
inputs: [query, offset]
request:
  url: "{base_url}/api/citations/search?q={query:url}&page.size=50&page.from={offset}&disseminated=DOCUMENT_AND_METADATA"
  headers: {Accept: application/json}
response:
  format: json
extract:
  items: {json: "$.results[*]"}
  fields:
    listing_key: {json: "$.id", required: true, transforms: [{regex_extract: {pattern: '^([0-9]{8,14})$', group: 1}}]}
    title: {json: "$.title", required: true, transforms: [trim]}
    creator: {json: "$.authorAffiliations[0].meta.author.name", transforms: [trim]}
    content_type: {template: "paper"}
pagination:
  mode: offset
  start: 0
  step: 50
  max_pages: 5
  stop_when: total_count
  total: {json: "$.stats.total"}
