capability: work
inputs: [listing_key]
request:
  url: "{base_url}/text/{listing_key:path}"
  headers: {Accept: text/html}
response:
  format: html
extract:
  fields:
    title: {css: "h1 span.text-title a::text", required: true, transforms: [trim]}
    creator: {css: "h1 span.author-title a::text", transforms: [trim]}
    language: {template: "bg"}
    content_type: {template: "book"}
