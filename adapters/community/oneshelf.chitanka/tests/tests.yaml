# Fixtures are live pages (2026-10-07).
cases:
- capability: search
  inputs: {query: вазов}
  fixtures: [{url: 'https://chitanka.info/search?q=%D0%B2%D0%B0%D0%B7%D0%BE%D0%B2', file: fixtures/search-vazov.html}]
  expect:
    min_items: 5
    complete: true
    fields_present: [listing_key, title]
- capability: work
  inputs: {listing_key: 3753-pod-igoto}
  fixtures: [{url: 'https://chitanka.info/text/3753-pod-igoto', file: fixtures/text-3753-pod-igoto.html}]
  expect:
    first: {title: Под игото, creator: Иван Вазов, language: bg}
- capability: catalog
  inputs: {listing_key: 3753-pod-igoto}
  fixtures: [{url: 'https://chitanka.info/text/3753-pod-igoto', file: fixtures/text-3753-pod-igoto.html}]
  expect:
    min_items: 80
    complete: true
    first: {unit_key: 3753-pod-igoto, title: Част първа}
- capability: reader
  inputs: {unit_key: 3753-pod-igoto/1}
  fixtures: [{url: 'https://chitanka.info/text/3753-pod-igoto/1', file: fixtures/text-3753-pod-igoto-part-1.html}]
  expect:
    min_items: 1
    complete: true
    text_contains: Тая прохладна майска вечер чорбаджи Марко
# 4: a text marked "Пълни авторски права" (original and translation) has no unit …
- capability: catalog
  inputs: {listing_key: 52881-nikoj-ne-znae-za-nas}
  fixtures: [{url: 'https://chitanka.info/text/52881-nikoj-ne-znae-za-nas', file: fixtures/text-52881-full-copyright.html}]
  expect:
    first: {unit_key: null}
# 5: … and no text.
- capability: reader
  inputs: {unit_key: 52881-nikoj-ne-znae-za-nas}
  fixtures: [{url: 'https://chitanka.info/text/52881-nikoj-ne-znae-za-nas', file: fixtures/text-52881-full-copyright.html}]
  expect:
    first: {html: null}
