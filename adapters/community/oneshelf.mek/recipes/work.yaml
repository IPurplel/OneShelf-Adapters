capability: work
inputs: [listing_key]
request:
  url: "{base_url}/{listing_key:segments}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  fields:
    title: {css: "h3.title::text", required: true, transforms: [trim]}
    creator: {css: "h4.author a::text", all: true, transforms: [{join: {sep: ", "}}]}
    language: {css: "meta[name=content-language]::attr(content)", transforms: [trim]}
    content_type: {template: "book"}
