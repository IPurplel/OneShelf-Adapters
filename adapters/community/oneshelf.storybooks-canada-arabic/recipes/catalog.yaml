# A story is one Reading Unit, the Master's one_shot (§4.4). The unit exists only if the page offers the
# story's Arabic PDF, so a missing story has no unit.
capability: catalog
inputs: [listing_key]
request:
  url: "{base_url}/stories/ar/{listing_key:path}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  items: {xpath: "(//a[starts-with(@href, '/pdf/ar/ar-')][contains(@href, '_read.pdf')])[1]"}
  fields:
    unit_key: {css: "::attr(href)", required: true,
               transforms: [{regex_extract: {pattern: '^/pdf/ar/ar-([0-9]{4})_read\.pdf$', group: 1}}]}
    unit_type: {template: "one_shot"}
pagination:
  mode: none
  complete_when: single_response
