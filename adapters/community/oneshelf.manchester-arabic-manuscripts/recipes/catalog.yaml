# One manuscript is one Reading Unit, the Master's one_shot (§4.4): read as its sequence of pages.
capability: catalog
inputs: [listing_key]
request:
  url: "{base_url}/iiif/{listing_key:path}"
  headers: {Accept: application/json}
response:
  format: json
extract:
  items: {json: "$"}
  fields:
    unit_key: {template: "{listing_key}", required: true}
    title: {json: "$.label", transforms: [trim]}
    unit_type: {template: "one_shot"}
pagination:
  mode: none
  complete_when: single_response
