# Fixtures are live pages (2026-10-12), except the one marked SYNTHETIC.
cases:
- capability: work
  inputs: {listing_key: '6'}
  fixtures: [{url: 'https://ehsj.elmergib.edu.ly/index.php/ejhs/issue/view/6', file: fixtures/issue_6.html}]
  expect:
    first: {title: "مجلة العلوم الإنسانية المرقب — عدد 32 (2026)", language: ar}
- capability: catalog
  inputs: {listing_key: '6'}
  fixtures: [{url: 'https://ehsj.elmergib.edu.ly/index.php/ejhs/issue/view/6', file: fixtures/issue_6.html}]
  expect:
    min_items: 20
    complete: true
    first: {unit_key: '134'}
- capability: downloads
  inputs: {unit_key: '134'}
  fixtures: [{url: 'https://ehsj.elmergib.edu.ly/index.php/ejhs/article/view/134', file: fixtures/article_134.html}]
  expect:
    min_items: 1
    complete: true
    first: {url: 'https://ehsj.elmergib.edu.ly/index.php/ejhs/article/download/134/105', format: pdf, language: ar}
# 3: SYNTHETIC (the fixture says so): the same article page with its licence removed — no file.
- capability: downloads
  inputs: {unit_key: '134'}
  fixtures: [{url: 'https://ehsj.elmergib.edu.ly/index.php/ejhs/article/view/134', file: fixtures/synthetic-no-licence_134.html}]
  expect:
    first: {url: null}
