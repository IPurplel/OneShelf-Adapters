# An article, read as text (plugin API 1.2): its body (section#corps) — not the notes, bibliography,
# toolbox or site navigation. Only while the article's page states a Creative Commons licence (p.licence):
# the template joins the body with that link and the pattern keeps it only then. An article under "Tous
# droits réservés", or offered as PDF only, gives no text.
capability: reader
inputs: [unit_key]
request:
  url: "{base_url}/fr/revues/{unit_key:segments}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  values:
    licence: {css: "p.licence a::attr(href)"}
    heading: {css: "meta[name=citation_title]::attr(content)"}
  items: {css: "section#corps"}
  fields:
    html:
      template: "{item}|{licence}"
      transforms: [{regex_extract: {pattern: '^((?s:.*))\|https?://creativecommons\.org/(?:licenses|publicdomain)/[a-z0-9./-]+$', group: 1}}]
    title: {template: "{heading}"}
pagination:
  mode: none
  complete_when: single_response
