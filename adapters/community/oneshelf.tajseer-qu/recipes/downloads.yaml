# The article's PDF, as its page names it (citation_pdf_url, the journal's download address) — only while the
# page states a Creative Commons licence (its DC.Rights meta tag).
capability: downloads
inputs: [unit_key]
request:
  url: "{base_url}/index.php/tajseer/article/view/{unit_key}"
  headers: {Accept: text/html}
response:
  format: html
extract:
  values:
    licence: {xpath: "(//meta[@name='DC.Rights'][starts-with(@content, 'https://creativecommons.org/licenses/')]/@content)[1]"}
  items: {css: "meta[name=citation_pdf_url]"}
  fields:
    url:
      template: "{item}|{licence}"
      required: true
      transforms: [{regex_extract: {pattern: 'content="(https://journals\.qu\.edu\.qa/index\.php/tajseer/article/download/[0-9]+/[0-9]+)"(?s:.*)\|https://creativecommons\.org/licenses/[a-z-]+/[0-9.]+/?$', group: 1}}]
    format: {template: "pdf", required: true}
pagination:
  mode: none
  complete_when: single_response
