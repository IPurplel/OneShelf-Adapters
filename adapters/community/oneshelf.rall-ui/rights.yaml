    The journal states "Access: Open Access (Published articles are free to access and download)" and
    "Rall by University of Isfahan is licensed under a Creative Commons Attribution-NonCommercial-NoDerivatives
    4.0 International License". The licence is stated journal-wide (its about page), not on issue or article
    pages, so it applies to the whole source. The article PDF is stored unaltered for private,
    non-commercial reading.
  exclusion_tests: []
evidence:
  - claim: "Rall by University of Isfahan is licensed under a Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International License."
    url: https://rall.ui.ac.ir/journal/about?lang=en
  - claim: robots.txt allows everything but the site's internals (/class/, /data/, /lib/, /request/, /tmp/, /main/).
    url: https://rall.ui.ac.ir/robots.txt
last_verified: 2026-10-08
