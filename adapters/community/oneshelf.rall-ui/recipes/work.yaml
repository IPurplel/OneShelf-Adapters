# The issue page (the journal's own site, Sinaweb): the journal's name and the issue's volume, number and
# date, from its "المجلد والعدد" line (this template has no bookmark icon).
capability: work
inputs: [listing_key]
request:
  url: "{base_url}/{listing_key:path}.html"
  headers: {Accept: text/html}
response:
  format: html
extract:
  values:
    issue: {xpath: "(//*[contains(text(), 'المجلد والعدد')]/span)[1]/text()"}
  fields:
    title: {template: "بحوث في اللغة العربية — {issue}", required: true}
    description: {css: "meta[name=description]::attr(content)", transforms: [trim]}
    creator: {template: "بحوث في اللغة العربية (University of Isfahan)"}
    language: {template: "ar"}
    content_type: {template: "paper"}
