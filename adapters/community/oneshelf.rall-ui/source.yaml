base_url: https://rall.ui.ac.ir
url_patterns:
  - pattern: '^https://rall\.ui\.ac\.ir/(issue_[0-9]+_[0-9]+)\.html(?:[?#]|$)'
    capability: work
    id_group: 1
# robots.txt allows everything but the site's own internals (/class/, /data/, /lib/, /request/, /tmp/, /main/).
rate_limit:
  requests_per_minute: 20
  concurrency: 1
