# The monolingual Arabic reading edition — not the wordless, imageless, bilingual or booklet editions.
capability: downloads
inputs: [unit_key]
request:
  url: "{base_url}/stories/ar/{unit_key:path}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  items: {xpath: "(//a[starts-with(@href, 'https://globalstorybooks.net/media/ue/pdf/ar/ar-')][contains(@href, '_read.pdf')])[1]"}
  fields:
    url: {css: "::attr(href)", required: true, transforms: [normalize_url]}
    format: {template: "pdf", required: true}
    language: {template: "ar"}
pagination:
  mode: none
  complete_when: single_response
