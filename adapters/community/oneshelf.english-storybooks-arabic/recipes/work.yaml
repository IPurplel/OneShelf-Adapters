capability: work
inputs: [listing_key]
request:
  url: "{base_url}/stories/ar/{listing_key:path}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  fields:
    title: {css: "title::text", required: true,
            transforms: [{regex_extract: {pattern: '^(.+) - Multilingual English Storybooks$', group: 1}}, trim]}
    creator: {xpath: "//h3[span[@data-tooltip='Written by']]/text()", transforms: [trim]}
    language: {template: "ar"}
    content_type: {template: "book"}
