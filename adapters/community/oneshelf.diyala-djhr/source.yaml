base_url: https://djhr.uodiyala.edu.iq
url_patterns:
  - pattern: '^https://djhr\.uodiyala\.edu\.iq/index\.php/DJHR2022/(?:[a-z]{2}(?:_[A-Z]{2})?/)?issue/view/([0-9]+)(?:[/?#]|$)'
    capability: work
    id_group: 1
# robots.txt allows everything; nothing this adapter requests.
rate_limit:
  requests_per_minute: 20
  concurrency: 1
