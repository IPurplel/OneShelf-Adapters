base_url: https://revues.imist.ma
url_patterns:
  - pattern: '^https://revues\.imist\.ma/index\.php/Lixus/(?:[a-z]{2}(?:_[A-Z]{2})?/)?issue/view/([0-9]+)(?:[/?#]|$)'
    capability: work
    id_group: 1
# robots.txt disallows only /cache/ and editorial, login, user, gateway and search paths (/index.php/*/search).
rate_limit:
  requests_per_minute: 20
  concurrency: 1
