base_url: https://hit.misuratau.edu.ly
url_patterns:
  - pattern: '^https://hit\.misuratau\.edu\.ly/ojs/index\.php/arts/(?:[a-z]{2}(?:_[A-Z]{2})?/)?issue/view/([A-Za-z0-9-]+)(?:[/?#]|$)'
    capability: work
    id_group: 1
# The host has no robots.txt (404); nothing this adapter requests.
rate_limit:
  requests_per_minute: 20
  concurrency: 1
