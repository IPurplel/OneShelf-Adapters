# The issue page (Open Journal Systems 3, Bootstrap 5 (University of Mosul) theme): the journal's name and the issue's heading (volume,
# number, year and title).
capability: work
inputs: [listing_key]
request:
  url: "{base_url}/index.php/berj/issue/view/{listing_key}"
  headers: {Accept: text/html}
response:
  format: html
extract:
  values:
    issue: {xpath: "(//ol[contains(@class, 'breadcrumb')]/li[last()])[1]", transforms: [{regex_replace: {pattern: '\s+', replacement: " "}}, trim]}
  fields:
    title: {template: "مجلة ابحاث كلية التربية الاساسية — {issue}", required: true}
    cover_url: {xpath: "(//div[contains(@class, 'issue-toc')]//img/@src)[1]", transforms: [normalize_url]}
    creator: {template: "مجلة ابحاث كلية التربية الاساسية"}
    language: {template: "ar"}
    content_type: {template: "paper"}
