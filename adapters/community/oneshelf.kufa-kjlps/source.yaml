base_url: https://journal.uokufa.edu.iq
url_patterns:
  - pattern: '^https://journal\.uokufa\.edu\.iq/index\.php/kjlps/(?:[a-z]{2}(?:_[A-Z]{2})?/)?issue/view/([0-9]+)(?:[/?#]|$)'
    capability: work
    id_group: 1
# robots.txt disallows only /cache/, system paths and login pages; nothing this adapter requests.
rate_limit:
  requests_per_minute: 20
  concurrency: 1
