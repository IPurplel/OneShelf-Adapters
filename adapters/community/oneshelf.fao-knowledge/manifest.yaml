schema: oneshelf.osp/1
id: oneshelf.fao-knowledge
name: FAO Open Knowledge
version: 0.1.0
api: '1.2'
description: >-
  FAO Open Knowledge: the Food and Agriculture Organization's publications, as PDF. An item is a work with one unit, downloaded as the PDF the
  repository names for it — only while the item's own page links a Creative Commons licence (most items CC BY-NC-SA 3.0 IGO or CC BY 4.0).
  Open an item by pasting its address (openknowledge.fao.org/items/…, /entities/publication/… or /handle/…). No search:
  the repository's robots.txt disallows its search pages and its API except file downloads.
publisher: OneShelf
capabilities: [work, catalog, downloads]
network:
  domains: [openknowledge.fao.org]
defaults:
  language: en
  content_type: paper
