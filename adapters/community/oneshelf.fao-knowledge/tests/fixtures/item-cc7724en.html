<meta name="Generator" content="DSpace 7.2.1"><meta name="title" content="The State of Food and Agriculture 2023"><meta name="description" content="Agrifood systems generate significant benefits to society, including the food that nourishes us and jobs and livelihoods for over a billion people. However, their negative impacts due to unsustainable business-as-usual activities and practices are contributing to climate change, natural resource degradation and the unaffordability of healthy diets. Addressing these negative impacts is challenging, because people, businesses, governments and other stakeholders lack a complete picture of how their activities affect economic, social and environmental sustainability when they make decisions on a day-to-day basis.The State of Food and Agriculture 2023 looks into the true cost of food for sustainable agrifood systems. The report introduces the concept of hidden environmental, health and social costs and benefits of agrifood systems and proposes an approach – true cost accounting (TCA) – to assess them. To operationalize the TCA approach, the report proposes a two-phase assessment process, first relying on national-level TCA assessments to raise awareness and then moving towards in-depth and targeted evaluations to prioritize solutions and guide transformative actions. It provides a first attempt at national-level assessments for 154 countries, suggesting that global hidden costs from agrifood systems amount to at least to 10 trillion 2020 PPP dollars. The estimates indicate that low-income countries bear the highest burden of the hidden costs of agrifood systems relative to national income. Despite the preliminary nature of these estimates, the analysis reveals the urgent need to factor hidden costs into decision-making for the transformation of agrifood systems. Innovations in research and data, alongside investments in data collection and capacity building, are needed to scale the application of TCA, especially in low- and middle-income countries, so that it can become a viable tool to inform decision- and policymaking in a transparent and consistent way."><meta name="citation_title" content="The State of Food and Agriculture 2023"><meta name="citation_author" content="FAO"><meta name="citation_publication_date" content="2023"><meta name="citation_issn" content="0081-4539"><meta name="citation_isbn" content="978-92-5-138167-0"><meta name="citation_language" content="English"><meta name="citation_abstract_html_url" content="https://openknowledge.fao.org/handle/20.500.14283/cc7724en"><meta name="citation_publisher" content="FAO ;"><link rel="canonical" href="https://openknowledge.fao.org/handle/20.500.14283/cc7724en"><link rel="icon" href="assets/client/images/favicons/favicon.ico" sizes="any" class="theme-head-tag"><meta name="citation_pdf_url" content="http://openknowledge.fao.org/bitstreams/5aac5078-625d-4b94-b964-bea40493016c/download"></head><body><ds-client-cc-license-icons _ngcontent-sc870="" _nghost-sc868="" class="ng-star-inserted">
