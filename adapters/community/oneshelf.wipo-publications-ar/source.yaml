base_url: https://www.wipo.int
url_patterns:
  - pattern: '^https://www\.wipo\.int/publications/[a-z]{2}/details\.jsp\?id=([0-9]+)(?:[&#]|$)'
    capability: work
    id_group: 1
# robots.txt disallows neither /publications/ (pages and search) nor /edocs/pubdocs/ (the PDFs); no Crawl-delay.
rate_limit:
  requests_per_minute: 20
  concurrency: 1
