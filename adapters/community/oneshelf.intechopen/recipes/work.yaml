capability: work
inputs: [listing_key]
request:
  url: "{base_url}/books/{listing_key:path}"
  headers: {Accept: text/html}
response:
  format: html
extract:
  fields:
    title: {css: "h1::text", required: true, transforms: [trim]}
    creator: {css: "[class*='editor'] a::text", all: true, transforms: [{join: {sep: ', '}}, trim]}
    description: {css: "meta[property='og:description']::attr(content)", transforms: [trim]}
    cover_url: {css: "meta[property='og:image']::attr(content)"}
    language: {template: "en"}
    content_type: {template: "book"}
