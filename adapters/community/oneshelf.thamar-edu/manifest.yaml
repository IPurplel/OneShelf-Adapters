schema: oneshelf.osp/1
id: oneshelf.thamar-edu
name: "مجلة كلية التربية (Thamar University, Yemen) · Journal · AR"
version: 0.1.0
api: '1.0'
description: >-
  مجلة كلية التربية — an open-access journal of Thamar University (Yemen) on education, humanities and Islamic studies (Journal of the Faculty of Education), published with Open Journal
  Systems, its articles mostly in Arabic. An issue is a work and its articles are units, each downloaded as the
  journal's PDF — only while the article's own page states a Creative Commons licence (CC BY 4.0 on the
  articles sampled); an article's language is read from its own page. Open an issue by pasting its address
  (journal.tu.edu.ye/index.php/edu/issue/view/…).
publisher: OneShelf
capabilities: [work, catalog, downloads]
network:
  domains: [journal.tu.edu.ye]
defaults:
  language: ar
  content_type: paper
