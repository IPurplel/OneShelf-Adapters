# Fixtures are live pages (2026-10-09), except the one marked SYNTHETIC.
cases:
- capability: work
  inputs: {listing_key: '1093'}
  fixtures: [{url: 'https://journal.uokufa.edu.iq/index.php/ewjh/issue/view/1093', file: fixtures/issue_1093.html}]
  expect:
    first: {title: "مجلة كلية التربية للبنات للعلوم الإنسانية — Vol. 2 No. 37 (2025): Journal of the College of Education for Girls for Humanities", language: ar}
- capability: catalog
  inputs: {listing_key: '1093'}
  fixtures: [{url: 'https://journal.uokufa.edu.iq/index.php/ewjh/issue/view/1093', file: fixtures/issue_1093.html}]
  expect:
    min_items: 21
    complete: true
    first: {unit_key: '24454'}
- capability: downloads
  inputs: {unit_key: '24454'}
  fixtures: [{url: 'https://journal.uokufa.edu.iq/index.php/ewjh/article/view/24454', file: fixtures/article_24454.html}]
  expect:
    min_items: 1
    complete: true
    first: {url: 'https://journal.uokufa.edu.iq/index.php/ewjh/article/download/24454/16865', format: pdf, language: ar}
# 3: SYNTHETIC (the fixture says so): the same article page with its licence removed — no file.
- capability: downloads
  inputs: {unit_key: '24454'}
  fixtures: [{url: 'https://journal.uokufa.edu.iq/index.php/ewjh/article/view/24454', file: fixtures/synthetic-no-licence_24454.html}]
  expect:
    first: {url: null}
