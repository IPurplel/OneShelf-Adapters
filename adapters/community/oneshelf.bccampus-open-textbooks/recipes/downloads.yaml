# The book's EPUB export from its own page, under the same condition as catalog.yaml.
capability: downloads
inputs: [unit_key]
request:
  url: "{base_url}/{unit_key:path}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  items: {xpath: "(//a[substring(@href, string-length(@href) - 22) = 'open/download?type=epub'][//a[@rel='license'][contains(@href, 'creativecommons.org/')]])[1]"}
  fields:
    url: {xpath: "@href", required: true,
          transforms: [{regex_extract: {pattern: '^(https://opentextbc\.ca/[a-z0-9-]+/open/download\?type=epub)$', group: 1}}]}
    format: {template: "epub", required: true}
pagination:
  mode: none
  complete_when: single_response
