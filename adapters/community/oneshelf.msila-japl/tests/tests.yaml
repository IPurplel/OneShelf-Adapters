# Fixtures are live pages (2026-10-10), except the one marked SYNTHETIC.
cases:
- capability: work
  inputs: {listing_key: '173'}
  fixtures: [{url: 'https://journals.univ-msila.dz/index.php/JAPL/issue/view/173', file: fixtures/issue_173.html}]
  expect:
    first: {title: "مجلة دفاتر مخبر الشعرية الجزائرية — Vol. 6 No. 01 (2021)", language: ar}
- capability: catalog
  inputs: {listing_key: '173'}
  fixtures: [{url: 'https://journals.univ-msila.dz/index.php/JAPL/issue/view/173', file: fixtures/issue_173.html}]
  expect:
    min_items: 10
    complete: true
    first: {unit_key: '4475'}
- capability: downloads
  inputs: {unit_key: '4475'}
  fixtures: [{url: 'https://journals.univ-msila.dz/index.php/JAPL/article/view/4475', file: fixtures/article_4475.html}]
  expect:
    min_items: 1
    complete: true
    first: {url: 'https://journals.univ-msila.dz/index.php/JAPL/article/download/4475/3515', format: pdf, language: ar}
# 3: SYNTHETIC (the fixture says so): the same article page with its licence removed — no file.
- capability: downloads
  inputs: {unit_key: '4475'}
  fixtures: [{url: 'https://journals.univ-msila.dz/index.php/JAPL/article/view/4475', file: fixtures/synthetic-no-licence_4475.html}]
  expect:
    first: {url: null}
