# A story is one Reading Unit, the Master's one_shot (§4.4), and exists only if its page offers the PDF.
capability: catalog
inputs: [listing_key]
request:
  url: "{base_url}/read-and-listen/{listing_key:path}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  items: {xpath: "(//a[contains(@href, '/wp-content/uploads/')][substring(@href, string-length(@href) - 3) = '.pdf'])[1]"}
  fields:
    unit_key: {template: "{listing_key}", required: true}
    unit_type: {template: "one_shot"}
pagination:
  mode: none
  complete_when: single_response
