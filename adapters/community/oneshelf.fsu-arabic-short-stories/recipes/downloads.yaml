# The story's PDF (the page links it twice, as its name and as "Download": the first is taken).
capability: downloads
inputs: [unit_key]
request:
  url: "{base_url}/read-and-listen/{unit_key:path}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  items: {xpath: "(//a[contains(@href, '/wp-content/uploads/')][substring(@href, string-length(@href) - 3) = '.pdf'])[1]"}
  fields:
    url: {css: "::attr(href)", required: true,
          transforms: [{regex_extract: {pattern: '^(https://arabicshortstories\.create\.fsu\.edu/wp-content/uploads/[0-9]{4}/[0-9]{2}/[A-Za-z0-9_.-]+\.pdf)$', group: 1}}]}
    format: {template: "pdf", required: true}
    language: {template: "ar"}
pagination:
  mode: none
  complete_when: single_response
