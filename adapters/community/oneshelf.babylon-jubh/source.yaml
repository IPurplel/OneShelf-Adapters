base_url: https://www.journalofbabylon.com
url_patterns:
  - pattern: '^https://(?:www|mail)\.journalofbabylon\.com/index\.php/JUBH/(?:[a-z]{2}(?:_[A-Z]{2})?/)?issue/view/([0-9]+)(?:[/?#]|$)'
    capability: work
    id_group: 1
# robots.txt states no rules (only commented content signals); nothing this adapter requests.
rate_limit:
  requests_per_minute: 20
  concurrency: 1
