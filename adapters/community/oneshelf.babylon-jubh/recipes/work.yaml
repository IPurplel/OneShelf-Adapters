# The issue page (Open Journal Systems 3, Bootstrap 3 theme): the journal's name and the issue's heading (volume,
# number, year and title). The site writes its own links on a mail. host name; the cover is read from www.
capability: work
inputs: [listing_key]
request:
  url: "{base_url}/index.php/JUBH/issue/view/{listing_key}"
  headers: {Accept: text/html}
response:
  format: html
extract:
  values:
    issue: {xpath: "(//ol[contains(@class, 'breadcrumb')]/li[last()])[1]", transforms: [{regex_replace: {pattern: '\s+', replacement: " "}}, trim]}
  fields:
    title: {template: "مجلة جامعة بابل للعلوم الانسانية — {issue}", required: true}
    cover_url: {xpath: "(//div[contains(@class, 'issue-toc')]//a[contains(@class, 'cover')]//img/@src)[1]", transforms: [{regex_replace: {pattern: '^https://mail\.journalofbabylon\.com/', replacement: "https://www.journalofbabylon.com/"}}, normalize_url]}
    creator: {template: "مجلة جامعة بابل للعلوم الانسانية"}
    language: {template: "ar"}
    content_type: {template: "paper"}
