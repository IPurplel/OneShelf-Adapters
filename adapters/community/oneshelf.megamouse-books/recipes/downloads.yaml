# The unit's EPUB on the site — only while the book list says "You may share or copy the free books as much as
# you like, so long as you do not sell them".
capability: downloads
inputs: [unit_key]
request:
  url: "{base_url}/freebooklist.html"
  headers: {Accept: text/html}
response:
  format: html
extract:
  items: {xpath: "(//p[contains(normalize-space(.), 'You may share or copy the free books as much as you like, so long as you do not sell them')])[1]"}
  fields:
    url:
      template: "{unit_key}"
      required: true
      transforms:
        - {regex_extract: {pattern: '^([a-z0-9]+(?:-[a-z0-9]+)*)$', group: 1}}
        - {regex_replace: {pattern: '^(.*)$', replacement: 'https://www.megamousebooks.com/\1.epub'}}
    format: {template: "epub", required: true}
    language: {template: "en"}
pagination:
  mode: none
  complete_when: single_response
