# A book is one Reading Unit, the Master's one_shot (§4.4) — only while its page links a Creative Commons
# licence. Without one there is no unit.
capability: catalog
inputs: [listing_key]
request:
  url: "{base_url}/books/{listing_key:path}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  items: {xpath: "(//h1[//a[starts-with(@href, 'https://creativecommons.org/licenses/')]])[1]"}
  fields:
    unit_key: {template: "{listing_key}", required: true}
    title: {xpath: "text()", transforms: [trim]}
    unit_type: {template: "one_shot"}
    release_date: {xpath: "//meta[@name='citation_date']/@content", transforms: [parse_date]}
pagination:
  mode: none
  complete_when: single_response
