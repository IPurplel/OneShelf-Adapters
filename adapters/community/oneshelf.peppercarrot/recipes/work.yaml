capability: work
inputs: [listing_key]
request:
  url: "{base_url}/{listing_key:path}/webcomics/peppercarrot.html"
  headers: {Accept: text/html}
response:
  format: html
extract:
  fields:
    title: {template: "Pepper&Carrot", required: true}
    creator: {template: "David Revoy"}
    description: {css: "meta[property='og:description']::attr(content)", transforms: [trim]}
    cover_url: {css: "meta[property='og:image']::attr(content)"}
    # The page states its own language, which is the listing's.
    language: {css: "html::attr(lang)", transforms: [trim]}
    content_type: {template: "comic"}
