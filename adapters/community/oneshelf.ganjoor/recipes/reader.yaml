# A poem, read as text (plugin API 1.2): Ganjoor's own verse markup (each couplet a block, each hemistich
# a paragraph), without comments, recitations, images or navigation (switched off in the request).
# Offered only while the poet died before 1375 AH (about 1955), more than 70 years ago: Ganjoor also has a
# few twentieth-century poets (Rahi Mo'ayeri, Shahriar …) whose work may still be in copyright, and their
# poems yield no text. OneShelf Core sanitises the markup.
capability: reader
inputs: [unit_key]
request:
  url: "{base_url}/api/ganjoor/poem/{unit_key:path}?catInfo=true&catPoems=false&rhymes=false&recitations=false&images=false&songs=false&comments=false&verseDetails=false&navigation=false&relatedpoems=false"
  headers: {Accept: application/json}
response:
  format: json
extract:
  values:
    body: {json: "$.htmlText"}
    died: {json: "$.category.poet.deathYearInLHijri"}
  items: {json: "$"}
  fields:
    html:
      template: "{body}|{died}"
      transforms: [{regex_extract: {pattern: '^((?s:.*))\|(?:[1-9][0-9]{0,2}|1[0-2][0-9]{2}|13[0-6][0-9]|137[0-4])$', group: 1}}]
    title: {json: "$.fullTitle", transforms: [trim]}
pagination:
  mode: none
  complete_when: single_response
