# Fixtures are live pages (2026-10-09), except the one marked SYNTHETIC.
cases:
- capability: work
  inputs: {listing_key: '1088'}
  fixtures: [{url: 'https://journal.uokufa.edu.iq/index.php/jall/issue/view/1088', file: fixtures/issue_1088.html}]
  expect:
    first: {title: "مجلة اللغة العربية وآدابها — مجلد 1 عدد 43 (2026): مجلة اللغة العربية وآدابها، حزيران، 2026", language: ar}
- capability: catalog
  inputs: {listing_key: '1088'}
  fixtures: [{url: 'https://journal.uokufa.edu.iq/index.php/jall/issue/view/1088', file: fixtures/issue_1088.html}]
  expect:
    min_items: 8
    complete: true
    first: {unit_key: '22785'}
- capability: downloads
  inputs: {unit_key: '22785'}
  fixtures: [{url: 'https://journal.uokufa.edu.iq/index.php/jall/article/view/22785', file: fixtures/article_22785.html}]
  expect:
    min_items: 1
    complete: true
    first: {url: 'https://journal.uokufa.edu.iq/index.php/jall/article/download/22785/16951', format: pdf, language: ar}
# 3: SYNTHETIC (the fixture says so): the same article page with its licence removed — no file.
- capability: downloads
  inputs: {unit_key: '22785'}
  fixtures: [{url: 'https://journal.uokufa.edu.iq/index.php/jall/article/view/22785', file: fixtures/synthetic-no-licence_22785.html}]
  expect:
    first: {url: null}
