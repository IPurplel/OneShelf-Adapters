capability: work
inputs: [listing_key]
request:
  url: "{base_url}/node/{listing_key:path}"
  headers: {Accept: text/html}
response:
  format: html
extract:
  fields:
    title: {css: "h1::text", required: true, transforms: [trim]}
    creator: {xpath: "//div[strong[contains(., 'by')]]/a/text()", transforms: [trim]}
    language: {template: "en"}
    content_type: {template: "book"}
