capability: work
inputs: [listing_key]
request:
  url: "{base_url}/{listing_key:path}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  fields:
    title: {css: "h1.entry-title::text", required: true, transforms: [{split: {sep: ' ~ ', index: 1}}, trim]}
    aliases: {css: "h1.entry-title::text", transforms: [{split: {sep: ' ~ ', index: 0}}, trim]}
    creator: {template: "Habiba"}
    description: {css: "meta[property='og:description']::attr(content)", transforms: [trim]}
    cover_url: {css: "meta[property='og:image']::attr(content)"}
    language: {template: "arz"}
    content_type: {template: "book"}
