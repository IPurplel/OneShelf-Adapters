# The monolingual Egyptian Arabic edition, by its link text: "… – Egyptian Arabic", with no English or
# Spanish in it. The file names differ from book to book; the ebook is listed before the print editions.
capability: downloads
inputs: [unit_key]
request:
  url: "{base_url}/{unit_key:path}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  items: {xpath: "(//a[contains(@href, '.pdf')][contains(normalize-space(.), 'Egyptian Arabic') or contains(normalize-space(.), 'EgyptianArabic')][not(contains(., 'English'))][not(contains(., 'Spanish'))])[1]"}
  fields:
    url: {css: "::attr(href)", required: true,
          transforms: [{regex_extract: {pattern: '^(https://booksbyhabiba\.wordpress\.com/wp-content/uploads/[0-9]{4}/[0-9]{2}/[A-Za-z0-9_.-]+\.pdf)$', group: 1}}]}
    format: {template: "pdf", required: true}
    language: {template: "arz"}
pagination:
  mode: none
  complete_when: single_response
