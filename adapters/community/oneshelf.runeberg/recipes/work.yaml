capability: work
inputs: [listing_key]
request:
  url: "{base_url}/{listing_key:path}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  fields:
    title: {css: "head > title::text", required: true, transforms: [trim]}
    creator: {xpath: "(//a[starts-with(@href, '/authors/')])[1]/text()", transforms: [trim]}
    language: {xpath: "/html/@lang", transforms: [trim]}
    content_type: {template: "book"}
