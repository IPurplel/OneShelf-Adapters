schema: oneshelf.osp/1
id: oneshelf.wolne-lektury
name: Wolne Lektury
version: 0.1.0
api: '1.0'
description: >-
  Wolne Lektury, the Polish free-books library of the Modern Poland Foundation: over 7,000 works —
  Polish school reading, classics, poetry and the foundation's own translations — every one in the public
  domain or under a free licence (Free Art License 1.3, CC BY-SA). Search is the library's own API. A book
  is one Reading Unit, downloaded as the library's EPUB; a book still in its supporters-only preview has no
  unit. No page reader (the EPUB opens in the Book Reader).
publisher: OneShelf
capabilities: [search, work, catalog, downloads]
network:
  domains: [wolnelektury.pl]
defaults:
  language: pl
  content_type: book
