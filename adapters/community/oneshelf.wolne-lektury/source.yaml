base_url: https://wolnelektury.pl
url_patterns:
  - pattern: '^https://wolnelektury\.pl/katalog/lektura/([a-z0-9-]+)/?(?:[?#]|$)'
    capability: work
    id_group: 1
# robots.txt disallows /szukaj/ (the HTML search), /przypisy/, /katalog/custompdf/ and a few tools — none of
# which this adapter requests; it uses the public API (/api/2/).
rate_limit:
  requests_per_minute: 30
  concurrency: 1
