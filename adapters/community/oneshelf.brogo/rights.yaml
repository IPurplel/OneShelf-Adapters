# What this source lets a OneShelf user do, and how the adapter keeps to it (docs/rights-model.md).
schema: oneshelf.rights/1
access_scope: whole_source
access_type: open_license
rights_granularity: source
license:
  id: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
commercial_use: allowed
redistribution: allowed
derivatives: allowed
attribution:
  required: true
  text: "Brogo by Malcolm Wilson (CC BY-SA 4.0 / GFDL 1.3) — https://icculus.org/mwm/brogo/home.html"
visibility: all_listed_items
local_copy: allowed
enforcement:
  summary: >-
    The creator states on the comic's home page that "all of Brogo is released under the Creative Commons
    Attribution-ShareAlike 4.0 International License and/or the GNU Free Documentation License Version 1.3,
    or any later versions". OneShelf stores the strips unaltered for private reading, with attribution.
  exclusion_tests: []
evidence:
  - claim: "All of Brogo is released under the Creative Commons Attribution-ShareAlike 4.0 International License and/or the GNU Free Documentation License Version 1.3."
    url: https://icculus.org/mwm/brogo/home.html
  - claim: robots.txt disallows only /remakequake/forum/.
    url: https://icculus.org/robots.txt
last_verified: 2026-10-07
