base_url: https://cyberleninka.ru
url_patterns:
  - pattern: '^https://cyberleninka\.ru/article/n/([a-z0-9-]+)/?(?:[?#]|$)'
    capability: work
    id_group: 1
# robots.txt disallows /search, /api/, the viewer and the PDFs (/article/n/*/pdf); the article page itself
# (/article/n/<slug>) is allowed.
rate_limit:
  requests_per_minute: 20
  concurrency: 1
