capability: work
inputs: [listing_key]
request:
  url: "{base_url}/api/v1/commons/book/{listing_key:path}"
  headers: {Accept: application/json}
response:
  format: json
extract:
  fields:
    title: {json: "$.book.title", required: true, transforms: [trim]}
    creator: {json: "$.book.author", transforms: [trim]}
    description: {json: "$.book.summary", transforms: [trim]}
    language: {json: "$.book.library", transforms: [{regex_replace: {pattern: '^(bio|biz|chem|eng|geo|human|k12|math|med|phys|socialsci|stats|workforce)$', replacement: 'en'}}, {replace: {old: espanol, new: es}}, {replace: {old: ukrayinska, new: uk}}, {regex_extract: {pattern: '^([a-z]{2})$', group: 1}}]}
    content_type: {template: "book"}
