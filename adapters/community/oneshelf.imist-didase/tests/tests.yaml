# Fixtures are live pages (2026-10-08), except the one marked SYNTHETIC.
cases:
- capability: work
  inputs: {listing_key: '705'}
  fixtures: [{url: 'https://journals.imist.ma/index.php/DidaSE/ar/issue/view/705', file: fixtures/issue_705.html}]
  expect:
    first: {title: "مجلة الديداكتيك للعلوم التربوية — مجلد 2 عدد 8 (2026): مجلة الديداكتيك للعلوم التربوية", language: ar}
- capability: catalog
  inputs: {listing_key: '705'}
  fixtures: [{url: 'https://journals.imist.ma/index.php/DidaSE/ar/issue/view/705', file: fixtures/issue_705.html}]
  expect:
    min_items: 42
    complete: true
    first: {unit_key: '14058'}
- capability: downloads
  inputs: {unit_key: '14058'}
  fixtures: [{url: 'https://journals.imist.ma/index.php/DidaSE/ar/article/view/14058', file: fixtures/article_14058.html}]
  expect:
    min_items: 1
    complete: true
    first: {url: 'https://journals.imist.ma/index.php/DidaSE/article/download/14058/8281', format: pdf}
# 3: SYNTHETIC (the fixture says so): the same article page with its licence removed — no file.
- capability: downloads
  inputs: {unit_key: '14058'}
  fixtures: [{url: 'https://journals.imist.ma/index.php/DidaSE/ar/article/view/14058', file: fixtures/synthetic-no-licence_14058.html}]
  expect:
    first: {url: null}
