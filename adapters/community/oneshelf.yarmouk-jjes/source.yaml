base_url: https://jjes.yu.edu.jo
url_patterns:
  - pattern: '^https://jjes\.yu\.edu\.jo/index\.php/jjes/(?:[a-z]{2}(?:_[A-Z]{2})?/)?issue/view/([0-9]+)(?:[/?#]|$)'
    capability: work
    id_group: 1
# robots.txt disallows only /cache/; nothing this adapter requests.
rate_limit:
  requests_per_minute: 20
  concurrency: 1
