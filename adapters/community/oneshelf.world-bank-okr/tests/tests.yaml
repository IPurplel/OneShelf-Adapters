    first: {title: "Priorities for Sustainable Growth : A Strategy for Agriculture Sector Development in Tajikistan, Technical Annex 5. Agriculture Growth Decomposition"}
- capability: catalog
  inputs: {listing_key: entities/publication/0771d1f2-0426-594f-8713-c01e7cd42e12}
  fixtures: [{url: 'https://openknowledge.worldbank.org/entities/publication/0771d1f2-0426-594f-8713-c01e7cd42e12', file: fixtures/item-0771d1f2.html}]
  expect:
    min_items: 1
    complete: true
    first: {unit_key: entities/publication/0771d1f2-0426-594f-8713-c01e7cd42e12}
- capability: downloads
  inputs: {unit_key: entities/publication/0771d1f2-0426-594f-8713-c01e7cd42e12}
  fixtures: [{url: 'https://openknowledge.worldbank.org/entities/publication/0771d1f2-0426-594f-8713-c01e7cd42e12', file: fixtures/item-0771d1f2.html}]
  expect:
    min_items: 1
    complete: true
    first: {url: 'https://openknowledge.worldbank.org/server/api/core/bitstreams/634e9e9f-2803-5980-8630-6512e197d4a2/content', format: pdf}
