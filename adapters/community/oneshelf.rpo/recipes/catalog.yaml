# A poet's poems, in RPO's index order; a poem's key is its page path (content/<slug> or node/<id>). Only
# while the poet's page gives a death date ending in a year of 1955 or earlier: the template joins each
# link with that date and the pattern keeps the link only then. A living poet, a poet without a death date
# or one who died later has no units.
capability: catalog
inputs: [listing_key]
request:
  url: "{base_url}/poets/{listing_key:path}"
  headers: {Accept: text/html}
response:
  format: html
extract:
  values:
    death: {css: "div.field--name-dynamic-twig-fieldnode-death-date div.field__item::text"}
  items: {xpath: "//ol[contains(@class, 'poet-titles-list')]//a[starts-with(@href, '/content/') or starts-with(@href, '/node/')]"}
  fields:
    unit_key:
      template: "{item}|{death}"
      required: true
      transforms: [{regex_extract: {pattern: '^<a href="/((?:content|node)/[a-z0-9-]+)"(?s:.*)\|[^|]*\b(?:[0-9]{1,3}|1[0-8][0-9]{2}|19[0-4][0-9]|195[0-5])\s*$', group: 1}}]
    title: {xpath: "./text()", transforms: [trim]}
pagination:
  mode: none
  complete_when: single_response
