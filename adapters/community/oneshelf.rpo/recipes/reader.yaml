# A poem, read as text (plugin API 1.2): its body only — the title, poet line, source note, line-number
# toggle and site navigation are outside it, and line numbers are removed. The poem is offered only while
# its own page names a poet whose dates end in a year of 1955 or earlier ("Brooks, Shirley (1816 - 1874)").
capability: reader
inputs: [unit_key]
request:
  url: "{base_url}/{unit_key:segments}"
  headers: {Accept: text/html}
response:
  format: html
extract:
  values:
    poet: {css: "h2.poet-name-in-poem a::text"}
    heading: {css: "h1.title span::text"}
  # A page naming more than one poet (the date gate reads the first) offers nothing.
  items: {xpath: "//div[contains(@class, 'field--name-field-poem-body')][count(//h2[contains(@class, 'poet-name-in-poem')]) = 1]"}
  fields:
    html:
      template: "{item}|{poet}"
      transforms:
        - {regex_extract: {pattern: '^((?s:.*))\|[^|]*\([^()|]*-\s*(?:c\.\s*)?(?:[0-9]{1,3}|1[0-8][0-9]{2}|19[0-4][0-9]|195[0-5])\s*(?:BCE?|CE|AD)?\s*\)\s*$', group: 1}}
        - {regex_replace: {pattern: '<span class="line-no[^"]*">[^<]*</span>', replacement: ''}}
        - {regex_replace: {pattern: '<input[^>]*>', replacement: ''}}
    title: {template: "{heading}"}
pagination:
  mode: none
  complete_when: single_response
