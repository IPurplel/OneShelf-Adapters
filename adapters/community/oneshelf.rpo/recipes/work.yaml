capability: work
inputs: [listing_key]
request:
  url: "{base_url}/poets/{listing_key:path}"
  headers: {Accept: text/html}
response:
  format: html
extract:
  fields:
    title: {css: "h1.title span::text", required: true, transforms: [trim]}
    creator: {css: "h1.title span::text", transforms: [trim]}
    description: {xpath: "(//div[contains(@class, 'field--name-field-poet-biography')]//p)[1]//text()", transforms: [trim]}
    language: {template: "en"}
    content_type: {template: "book"}
