capability: work
inputs: [listing_key]
request:
  url: "{base_url}/1.0/tgsearch-public/info/textgrid:{listing_key:path}/metadata"
  headers: {Accept: application/xml}
response:
  format: html
extract:
  fields:
    title: {xpath: "//object[.//project[@id = 'TGPR-372fe6dc-57f2-6cd4-01b5-2c4bbefcfd3c']][.//format[normalize-space(.) = 'text/tg.edition+tg.aggregation+xml']][.//license[@licenseuri = 'http://creativecommons.org/licenses/by/3.0/de/legalcode']]//provided/title/text()", required: true, transforms: [trim]}
    creator: {xpath: "//edition/agent[@role = 'author']/text()", transforms: [trim]}
    description: {xpath: "//provided/notes/text()", transforms: [trim]}
    language:
      xpath: "//edition/language/text()"
      transforms: [trim, {regex_replace: {pattern: "^deu$", replacement: de}}]
    content_type: {template: "book"}
