base_url: https://textgridlab.org
url_patterns:
  - pattern: '^https://textgridrep\.org/browse/(?:textgrid:)?([a-z0-9]+\.[0-9]+)(?:[?#]|$)'
    capability: work
    id_group: 1
# textgridlab.org robots.txt disallows only the zip, teicorpus and epub aggregators; tgsearch-public and
# the html aggregator are allowed.
rate_limit:
  requests_per_minute: 20
  concurrency: 1
