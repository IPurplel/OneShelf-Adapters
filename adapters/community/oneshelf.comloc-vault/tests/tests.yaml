# Fixtures are live pages (2026-10-12), except the one marked SYNTHETIC.
cases:
- capability: work
  inputs: {listing_key: planet-comics-1}
  fixtures: [{url: 'https://www.comicshoplocator.com/comics/read/planet-comics-1/', file: fixtures/planet-comics-1.html}]
  expect:
    first: {title: 'Planet Comics #1 (1940)', creator: Fiction House, language: en, content_type: comic}
- capability: catalog
  inputs: {listing_key: planet-comics-1}
  fixtures: [{url: 'https://www.comicshoplocator.com/comics/read/planet-comics-1/', file: fixtures/planet-comics-1.html}]
  expect:
    min_items: 1
    complete: true
    first: {unit_key: planet-comics-1, unit_type: one_shot}
- capability: reader
  inputs: {unit_key: planet-comics-1}
  fixtures: [{url: 'https://www.comicshoplocator.com/comics/read/planet-comics-1/', file: fixtures/planet-comics-1.html}]
  expect:
    min_items: 67
    complete: true
    first: {url: 'https://www.comicshoplocator.com/comics/read/planet-comics-1/pages/p001.webp', page_label: '1'}
# 3, 4: SYNTHETIC (the fixture says so): the same page without the JSON-LD "license" — no unit, no pages.
- capability: catalog
  inputs: {listing_key: planet-comics-1}
  fixtures: [{url: 'https://www.comicshoplocator.com/comics/read/planet-comics-1/', file: fixtures/synthetic-no-licence_planet-comics-1.html}]
  expect:
    first: {unit_key: null}
- capability: reader
  inputs: {unit_key: planet-comics-1}
  fixtures: [{url: 'https://www.comicshoplocator.com/comics/read/planet-comics-1/', file: fixtures/synthetic-no-licence_planet-comics-1.html}]
  expect:
    first: {url: null}
