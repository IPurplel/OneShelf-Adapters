base_url: https://ebible.org
url_patterns:
  - pattern: '^https?://(?:www\.)?ebible\.org/find/details\.php\?id=([A-Za-z0-9-]+)'
    capability: work
    id_group: 1
  - pattern: '^https?://(?:www\.)?ebible\.org/find/show\.php\?id=([A-Za-z0-9-]+)'
    capability: work
    id_group: 1
# robots.txt disallows nothing this adapter requests (only Baiduspider is restricted).
rate_limit:
  requests_per_minute: 20
  concurrency: 1
