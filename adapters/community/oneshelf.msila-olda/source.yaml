base_url: https://journals.univ-msila.dz
url_patterns:
  - pattern: '^https://journals\.univ\-msila\.dz/index\.php/OLDA/(?:[a-z]{2}(?:_[A-Z]{2})?/)?issue/view/([0-9]+)(?:[/?#]|$)'
    capability: work
    id_group: 1
# robots.txt sets Crawl-delay 5 and disallows setLocale, search and browse paths; nothing this adapter requests.
rate_limit:
  requests_per_minute: 10
  concurrency: 1
