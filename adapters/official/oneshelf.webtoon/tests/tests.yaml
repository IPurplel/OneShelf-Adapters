cases:
- capability: work
  inputs: {listing_key: '95'}
  fixtures:
  - url: https://www.webtoons.com/episodeList?titleNo=95
    file: fixtures/list.html
  expect:
    fields_present: [title, cover_url]
- capability: catalog
  inputs: {listing_key: '95', offset: 0}
  fixtures:
  - url: https://m.webtoons.com/api/v1/webtoon/95/episodes?pageSize=30&cursor=0
    file: fixtures/episodes.json
  expect:
    min_items: 5
    fields_present: [unit_key, title, url, number]
    first: {unit_key: '1', number: '0'}
- capability: reader
  inputs: {url: 'https://www.webtoons.com/en/fantasy/tower-of-god/season-1-ep-2/viewer?title_no=95&episode_no=3'}
  fixtures:
  - url: https://www.webtoons.com/en/fantasy/tower-of-god/season-1-ep-2/viewer?title_no=95&episode_no=3
    file: fixtures/viewer.html
  expect:
    min_items: 6
    fields_present: [url]
# Discover's browse lists (captured 2026-11-03, trimmed to four series each): the site's own pages, keyed by
# the same title_no the work recipe uses.
- capability: latest
  inputs: {}
  fixtures:
  - url: https://www.webtoons.com/en/originals?sortOrder=UPDATE
    file: fixtures/originals-update.html
  expect:
    min_items: 4
    fields_present: [listing_key, title, url, cover_url]
    first: {listing_key: '11361', title: The Day of Kidnapping}
- capability: trending
  inputs: {}
  fixtures:
  - url: https://www.webtoons.com/en/ranking/trending
    file: fixtures/ranking-trending.html
  expect:
    min_items: 4
    fields_present: [listing_key, title, url, cover_url]
    first: {listing_key: '2745', title: Hero Killer}
