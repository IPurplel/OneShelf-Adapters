# A Gutenberg book is one Reading Unit: the book itself, which the Master calls a one_shot (§4.4).
capability: catalog
inputs: [listing_key]
request:
  url: "{base_url}/books/{listing_key:path}/"
  headers: {Accept: application/json}
response:
  format: json
extract:
  items: {json: "$"}
  order: source_listed
  fields:
    unit_key: {json: "$.id", required: true}
    title: {json: "$.title", transforms: [trim]}
    unit_type: {template: "one_shot"}
pagination:
  mode: none
  complete_when: single_response
