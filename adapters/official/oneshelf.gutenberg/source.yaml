base_url: https://gutendex.com
url_patterns:
  - pattern: '^https?://(?:www\.)?gutenberg\.org/ebooks/(\d+)'
    capability: work
    id_group: 1
rate_limit:
  requests_per_minute: 30
  concurrency: 1
# Gutendex answers a search from its full catalogue and can take far longer than the 30-second default
# on a cold query (2026-09-29: one timed out at 30 s, the same query took 1 s moments later).
timeouts:
  read_seconds: 90
