schema: oneshelf.osp/1
id: oneshelf.mangadex
name: "MangaDex · Manga · Multi"
version: 1.1.0
api: '1.1'
description: >-
  MangaDex through its public JSON API. Search, work metadata, the chapter feed for one language and
  reader pages from the at-home server, and two browse lists for Discover: Latest (by newest
  uploaded chapter) and Trending (by follows). No login is required for public content.
publisher: OneShelf
capabilities:
  - search
  - work
  - catalog
  - reader
  - health
  - latest
  - trending
network:
  domains:
    - api.mangadex.org
  cdn_domains:
    - uploads.mangadex.org
    - '*.mangadex.network'
defaults:
  language: en
