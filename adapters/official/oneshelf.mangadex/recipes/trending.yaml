capability: trending
inputs: [offset]
# Most popular first: the series the most MangaDex readers follow. The same fields and keys as `search`,
# so a result opens the same Work; the API's default content ratings apply here as they do there.
request:
  url: "{base_url}/manga?limit=20&offset={offset}&order[followedCount]=desc"
  headers: {Accept: application/json}
response:
  format: json
extract:
  items: {json: "$.data[*]"}
  fields:
    listing_key: {json: "$.id", required: true}
    title: {json: "$.attributes.title[*]", required: true}
    original_title: {json: "$.attributes.altTitles[*][*]"}
    description: {json: "$.attributes.description[*]"}
    language: {json: "$.attributes.originalLanguage"}
    available_languages: {json: "$.attributes.availableTranslatedLanguages[*]", all: true}
pagination:
  mode: offset
  start: 0
  step: 20
  max_pages: 3
  stop_when: total_count
  total: {json: "$.total"}
