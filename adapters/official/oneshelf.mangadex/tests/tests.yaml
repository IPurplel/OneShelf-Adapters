cases:
- capability: search
  inputs: {query: dungeon}
  fixtures:
  - url: https://api.mangadex.org/manga?title=dungeon&limit=20&offset=0&order[relevance]=desc
    file: fixtures/search.json
  expect:
    min_items: 1
    fields_present: [listing_key, title]
# Discover's browse lists (captured 2026-11-03, trimmed to four series; `total` trimmed to match).
- capability: latest
  inputs: {offset: 0}
  fixtures:
  - url: https://api.mangadex.org/manga?limit=20&offset=0&order[latestUploadedChapter]=desc
    file: fixtures/latest.json
  expect:
    min_items: 4
    fields_present: [listing_key, title]
    first: {listing_key: e900135b-8eba-4d29-85c9-db3d5ae885c7}
- capability: trending
  inputs: {offset: 0}
  fixtures:
  - url: https://api.mangadex.org/manga?limit=20&offset=0&order[followedCount]=desc
    file: fixtures/trending.json
  expect:
    min_items: 4
    fields_present: [listing_key, title]
    first: {listing_key: 32d76d19-8a05-4db0-9fc2-e0b0648fe9d0}
- capability: work
  inputs: {listing_key: 0b531d71-f321-462d-b7ca-d056564bf8b3}
  fixtures:
  - url: https://api.mangadex.org/manga/0b531d71-f321-462d-b7ca-d056564bf8b3?includes[]=cover_art&includes[]=author
    file: fixtures/work.json
  expect:
    fields_present: [title, cover_url]
- capability: catalog
  inputs: {listing_key: 0b531d71-f321-462d-b7ca-d056564bf8b3, language: en}
  fixtures:
  - url: https://api.mangadex.org/manga/0b531d71-f321-462d-b7ca-d056564bf8b3/feed?limit=100&offset=0&translatedLanguage[]=en&order[chapter]=asc&order[volume]=asc&includeExternalUrl=0
    file: fixtures/feed.json
  expect:
    min_items: 1
    fields_present: [unit_key]
- capability: reader
  inputs: {unit_key: dc3cbd95-c448-4996-b056-0c22752a89ae}
  fixtures:
  - url: https://api.mangadex.org/at-home/server/dc3cbd95-c448-4996-b056-0c22752a89ae
    file: fixtures/at-home.json
  expect:
    min_items: 1
    fields_present: [url]
- capability: health
  inputs: {}
  fixtures:
  - url: https://api.mangadex.org/ping
    file: fixtures/ping.txt
    content_type: text/plain
  expect:
    fields_present: [ok]
    first: {ok: 'True'}
